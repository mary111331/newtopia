 }else{
  body='<div style="text-align:center;margin-top:10px"><div style="font-size:56px">🎉</div><h1>Verifiziert!</h1><p>Du bist ein echter Mensch und wohnst im <b>'+STREET+'</b>.</p></div>'+

 autoPair('hannelore','🥚 6 Eier, müssen bis Freitag weg','familie','🎂 Eier für den Geburtstagskuchen','Gleiche Sache, Haus 7 und Haus 11, die Eier laufen bald ab. Rettet Essen und einen Kindergeburtstag.',96)+
 autoPair('jonas','🪜 Stehleiter, 6 Stufen','mira','🌳 Leiter für Samstag','Jonas verleiht seine Leiter, Mira braucht sie am Samstag für den Kirschbaum.',91)+

 '<div class="card"><h3>So arbeitet die KI in Newtopia</h3><p class="small muted">Sie liest nur, was ihr selbst ans Brett und in eure Profile schreibt. Sie verkauft nichts, zeigt keine Werbung und entscheidet nichts über eure Köpfe hinweg. Sie achtet auf Nähe, Ablaufdaten und darauf, dass nicht immer dieselben helfen.</p></div>';

function autoPair(a,at,b,bt,why,score){
 return '<div class="card match"><div class="row" style="justify-content:space-between"><b>Passt zusammen</b><span class="score">'+score+' % Treffer</span></div>'+
 '<div class="pair"><div class="side">'+av(a,false,'margin:0 auto 5px')+'<b>'+esc(PEOPLE[a].name)+'</b><br>'+at+'</div><div class="arrow">⇄</div><div class="side">'+av(b,false,'margin:0 auto 5px')+'<b>'+esc(PEOPLE[b].name)+'</b><br>'+bt+'</div></div>'+
 '<div class="why">💡 '+why+'</div><button class="btn small sec" style="margin-top:10px;width:100%" data-connect="'+a+'|'+b+'">Beide zusammenbringen (Demo)</button></div>';
}
function bindKI(){
 var input=document.getElementById('need');
 document.querySelectorAll('[data-preset]').forEach(function(b){b.onclick=function(){input.value=b.dataset.preset;runKI();};});
 document.getElementById('kigo').onclick=runKI;
 input.onkeydown=function(e){if(e.key==='Enter')runKI();};
}
function runKI(){
 var q=document.getElementById('need').value.trim().toLowerCase();var out=document.getElementById('kiout');
 if(!q){toast('Schreib kurz, was du brauchst.');return;}
 out.innerHTML='<div class="card" style="text-align:center"><div class="spinner"></div><p class="muted small">Die KI schaut ins Brett und in die Profile im '+STREET+' …</p></div>';
 setTimeout(function(){
  var words=q.replace(/[^a-zäöüß ]/g,' ').split(/\s+/).filter(Boolean);var want={};
  words.forEach(function(w){Object.keys(KEYWORDS).forEach(function(k){if(w.indexOf(k)===0||(k.length>3&&w.indexOf(k)>=0)){KEYWORDS[k].forEach(function(t){want[t]=(want[t]||0)+(t===k?2:1);});}});});
  var res=posts().filter(function(p){return p.kind==='angebot'&&p.who!=='me';}).map(function(p){var s=0,hit=[];(p.tags||[]).forEach(function(t){if(want[t]){s+=want[t];hit.push(t);}});return {p:p,s:s,hit:hit};}).filter(function(x){return x.s>0;}).sort(function(a,b){return b.s-a.s;}).slice(0,3);
  if(!res.length){out.innerHTML='<div class="card"><h3>Noch kein Treffer</h3><p class="small muted">Im Moment hat niemand im '+STREET+' genau das angeboten. Soll die KI ein Gesuch ans Brett hängen? Sie meldet sich, sobald jemand passt.</p><button class="btn small" data-act="newpost">Gesuch ans Brett hängen</button></div>';return;}
  var max=res[0].s;
  out.innerHTML='<h2>Vorschläge für dich</h2>'+res.map(function(x,i){var who=PEOPLE[x.p.who];var pct=Math.min(98,Math.round(70+28*x.s/max)-i*4);var dist=Math.abs(parseInt(who.hn,10)-17)/2;
   return '<div class="card match"><div class="row" style="justify-content:space-between"><div class="row">'+av(x.p.who)+'<div><b>'+esc(who.name)+'</b><div class="small muted">Nr. '+who.hn+' · '+(dist<=1?'direkt nebenan':Math.round(dist)+' Häuser weiter')+'</div></div></div><span class="score">'+pct+' %</span></div>'+
   '<h3 style="margin-top:10px">'+x.p.icon+' '+esc(x.p.title)+'</h3>'+
   '<div class="why">💡 Warum: passt zu „'+esc(x.hit.slice(0,3).join(', '))+'“. '+esc(who.name)+' hat schon '+who.helped+' × in der Straße geholfen.'+(/bis |laufen|muss|weg/.test(x.p.desc+' '+x.p.title)?' Das Angebot ist zeitlich begrenzt, also schnell sein.':'')+'</div>'+
   (S.requested[x.p.id]?'<p class="done-badge">✓ Angefragt</p>':'<button class="btn small" style="margin-top:10px;width:100%" data-req="'+x.p.id+'">'+esc(who.name)+' fragen</button>')+'</div>';}).join('');
 },1300);
}

 '<p class="small">Solidarisch gestaffelt: Wer weniger hat, gibt weniger. Wer mehr hat, gibt mehr. Niemand wird ausgeschlossen.</p><input type="range" min="1" max="6" step="1" value="'+S.fee+'" id="fee" style="padding:0;border:none;background:none"><div class="row small muted" style="justify-content:space-between"><span>1 € ermäßigt</span><span>3 € normal</span><span>6 € solidarisch</span></div></div>'+
 '<h2>Wofür das Geld ausgegeben wird</h2><p class="small muted" style="margin-top:-4px">Offene Kasse: Jedes Mitglied sieht jeden Euro. Beispielrechnung bei 1.000 Mitgliedern, pro Monat (Demo-Zahlen).</p>'+
 '<div class="card">'+costs.map(function(c){return '<div class="costrow"><span>'+c[0]+'</span><b>'+c[1].toLocaleString('de-DE')+' €</b></div><div class="bar"><i style="width:'+(c[1]/total*100).toFixed(1)+'%;background:'+c[2]+'"></i></div>';}).join('')+
 '<hr style="border:none;border-top:1px solid var(--line);margin:14px 0 4px"><div class="costrow"><span>Ausgaben gesamt</span><b>'+total.toLocaleString('de-DE')+' €</b></div><div class="costrow"><span>Beiträge (1.000 × 3 €)</span><b>'+income.toLocaleString('de-DE')+' €</b></div><div class="costrow" style="color:var(--green)"><span><b>Gewinn für irgendwen</b></span><b>0 €</b></div><p class="small muted">Bleibt etwas übrig, entscheiden die Mitglieder gemeinsam: Beitrag senken oder für die Straßen ausgeben.</p></div>'+
 '<h2>Unsere Grundsätze</h2><div class="card">'+
 principle('🚫','Keine Werbung. Nie.','Keine Anzeigen, kein Tracking, kein Verkauf von Daten. Du bist hier nicht das Produkt.')+
 principle('🗳️','Ein Mitglied, eine Stimme','Egal wie viel jemand zahlt: Jede Stimme zählt gleich. Große Entscheidungen werden abgestimmt.')+
 principle('🪪','Datensparsam','Vom Ausweis bleibt nur: verifiziert und Straße. Keine zentrale Ausweis-Datenbank.')+
 principle('🌍','Offener Code','Der Quellcode soll offen sein, damit jede:r nachprüfen kann, was die App tut.')+
 principle('🌱','Gegenseitige Hilfe','Teilen statt verkaufen. Auf dem Brett gibt es kein Geld, nur Nachbarschaft.')+'</div>'+
 '<h2>Aktuelle Abstimmung im '+STREET+'</h2><div class="card"><b>Soll die Straße einen gemeinsamen Werkzeugschrank im Hof bekommen?</b><p class="small muted">Vorschlag von Jonas. Läuft noch 5 Tage. 23 von 34 Stimmen abgegeben.</p>'+
 (vote?'<p class="done-badge">✓ Du hast mit „'+(vote==='ja'?'Ja':'Nein')+'“ abgestimmt. Danke!</p>':'<div class="vote"><button class="btn small green" style="flex:1" data-vote="ja">Ja</button><button class="btn small sec" style="flex:1" data-vote="nein">Nein</button></div>')+'</div>'+
 '<blockquote>„Die Menschheit ist nicht durch den Kampf ums Dasein groß geworden, sondern durch gegenseitige Hilfe.“<cite>sinngemäß nach Pjotr Kropotkin</cite></blockquote>'+

function principle(e,t,d){return '<div class="principle"><div class="e">'+e+'</div><div><b>'+t+'</b><p class="small muted" style="margin:2px 0 0">'+d+'</p></div></div>';}

/* ---------- SHEETS / TOAST ---------- */
function sheet(html){closeSheet();var o=document.createElement('div');o.className='overlay';o.id='ov';o.innerHTML='<div class="sheet"><div class="grab"></div>'+html+'</div>';o.onclick=function(e){if(e.target===o)closeSheet();};document.body.appendChild(o);}
function closeSheet(){var o=document.getElementById('ov');if(o)o.remove();}
var tt;function toast(m){var t=document.querySelector('.toast');if(t)t.remove();t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);clearTimeout(tt);tt=setTimeout(function(){t.remove();},3200);}

/* ---------- EVENTS ---------- */
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act],[data-req],[data-cat],[data-kind],[data-pin],[data-go],[data-msg],[data-vote],[data-connect]');if(!el)return;
 var d=el.dataset;
 if(d.go){location.hash=d.go;return;}
 if(d.req){openRequest(d.req);return;}
 if(d.cat){boardCat=d.cat;render();return;}
 if(d.kind){boardKind=d.kind;render();return;}
 if(d.vote){S.votes.werkzeug=d.vote;save();render();toast('Deine Stimme zählt genau so viel wie jede andere.');return;}
 if(d.connect){var ab=d.connect.split('|');toast(PEOPLE[ab[0]].name+' und '+PEOPLE[ab[1]].name+' bekommen den Vorschlag (Demo).');el.outerHTML='<p class="done-badge">✓ Vorschlag verschickt</p>';return;}
 if(d.msg){var p=PEOPLE[d.msg];sheet('<div class="row">'+av(d.msg)+'<div><b>Nachricht an '+esc(p.name)+'</b><div class="small muted">Nr. '+p.hn+' · verifiziert</div></div></div><textarea id="pm" style="margin-top:12px">Hallo '+esc(p.name)+', </textarea><button class="btn" id="pmsend" style="margin-top:12px">Senden (Demo)</button>');document.getElementById('pmsend').onclick=function(){closeSheet();toast(p.name+' bekommt deine Nachricht (Demo).');};return;}
 if(d.pin){
  if(d.pin==='⌫')pin=pin.slice(0,-1);else if(pin.length<6)pin+=d.pin;
  if(pin.length===6){render();document.querySelector('.pad').style.display='none';document.getElementById('checking').style.display='block';setTimeout(function(){verifyStep=3;render();},1800);}else render();
  return;
 }
 var a=d.act;
 if(a==='vnext'){verifyStep=1;render();}
 else if(a==='vfinish'){var n=(document.getElementById('nm').value||'').trim();S.name=n||'Mary';S.verified=true;save();verifyStep=0;location.hash='home';toast('Willkommen im '+STREET+', '+S.name+'!');}
 else if(a==='newpost'){openNewPost();}
 else if(a==='skipdemo'){}
 else if(a==='reset'){localStorage.removeItem('newtopia_demo');S=load();verifyStep=0;location.hash='start';render();toast('Demo zurückgesetzt.');}
});
document.addEventListener('input',function(e){if(e.target.id==='fee'){S.fee=parseInt(e.target.value,10);save();var big=e.target.parentNode.querySelector('div[style*="34px"]');if(big)big.firstChild.nodeValue=S.fee+' € ';}});
window.addEventListener('hashchange',function(){if(location.hash==='#verify'&&verifyStep===3&&S.verified){}render();});
render();
})();
</script>
